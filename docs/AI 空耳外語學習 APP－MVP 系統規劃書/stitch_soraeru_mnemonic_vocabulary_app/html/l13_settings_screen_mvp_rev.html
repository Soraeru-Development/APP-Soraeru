<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Soraeru - 設定</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#181c1e",
                        "tertiary-container": "#885116",
                        "on-secondary-fixed": "#081e27",
                        "on-secondary-fixed-variant": "#364954",
                        "surface-bright": "#F5FAFD",
                        "background": "#f7f9fc",
                        "on-primary-fixed": "#001f2a",
                        "primary": "#004d64",
                        "on-tertiary-fixed-variant": "#6b3b00",
                        "surface-container-high": "#e6e8eb",
                        "on-primary-fixed-variant": "#004d64",
                        "on-surface-variant": "#3f484d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-container": "#eceef1",
                        "inverse-surface": "#2d3133",
                        "secondary": "#4d616c",
                        "on-secondary-container": "#536772",
                        "outline-variant": "#bfc8cd",
                        "primary-fixed-dim": "#87d0f2",
                        "on-tertiary-fixed": "#2d1600",
                        "primary-container": "#006684",
                        "surface-dim": "#D8E3E9",
                        "tertiary": "#6b3a00",
                        "status-warning": "#8B5000",
                        "secondary-container": "#d0e6f3",
                        "outline": "#70787e",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb876",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed": "#bee9ff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-background": "#181c1e",
                        "on-primary-container": "#a2e1ff",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#b4cad6",
                        "surface-container-low": "#f2f4f6",
                        "surface-tint": "#016684",
                        "on-secondary": "#ffffff",
                        "status-info": "#0061A4",
                        "status-danger": "#BA1A1A",
                        "surface": "#f7f9fc",
                        "on-tertiary-container": "#ffcfa6",
                        "tertiary-fixed": "#ffdcc0",
                        "on-error": "#ffffff",
                        "inverse-primary": "#87d0f2",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d0e6f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "16px",
                        "bottom-bar-height": "80px",
                        "gutter": "16px",
                        "stack-gap": "12px",
                        "appbar-height": "64px"
                    },
                    "fontFamily": {
                        "body-source-lg": ["Noto Sans"],
                        "caption": ["Noto Sans"],
                        "label-mono": ["JetBrains Mono"],
                        "display-hero": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-target-md": ["Noto Sans"]
                    },
                    "fontSize": {
                        "body-source-lg": ["22px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-hero": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-target-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-target-md min-h-screen flex flex-col md:items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-[600px] bg-surface/80 backdrop-blur-md z-40 h-appbar-height flex justify-between items-center px-gutter border-none mx-auto left-0 right-0">
<button aria-label="返回" class="p-2 text-primary hover:bg-surface-variant/50 rounded-full transition-opacity active:opacity-80">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold">設定</h1>
<!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] mt-appbar-height px-gutter py-6 flex flex-col gap-6">
<!-- Section 1: 帳號 -->
<section class="bg-surface-bright rounded-xl border border-outline-variant p-4 flex flex-col gap-4 shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-surface-variant pb-2">帳號</h2>
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline-sm">
                    JL
                </div>
<div>
<p class="font-body-target-md text-on-surface">Jean-Luc Picard</p>
<p class="font-caption text-caption text-on-surface-variant">jean-luc@enterprise.com</p>
</div>
</div>
<button class="text-left font-label-mono text-label-mono text-primary flex items-center justify-between w-full hover:bg-surface-variant/20 p-2 rounded-lg transition-colors">
<span>管理帳號</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</section>
<!-- Section 2: 使用額度 -->
<section class="bg-surface-bright rounded-xl border border-outline-variant p-4 flex flex-col gap-4 shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-surface-variant pb-2">使用額度</h2>
<div class="flex justify-between items-center bg-surface-container-low p-3 rounded-lg"><div><p class="font-body-target-md text-on-surface">免費方案</p><p class="font-caption text-caption text-on-surface-variant">今日剩餘：12／20</p></div><p class="font-caption text-caption text-on-surface-variant italic">付費方案即將推出</p></div>
</section>
<!-- Section 3: 標記偏好預設 -->
<section class="bg-surface-bright rounded-xl border border-outline-variant p-4 flex flex-col gap-4 shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-surface-variant pb-2">標記偏好預設</h2>
<div class="flex flex-col gap-3">
<label class="flex items-center gap-3 cursor-pointer">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="phonetic_pref" type="radio" value="zhuyin"/>
<span class="font-body-target-md text-on-surface">注音符號 (Zhuyin)</span>
</label>
<label class="flex items-center gap-3 cursor-pointer">
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline" name="phonetic_pref" type="radio" value="pinyin"/>
<span class="font-body-target-md text-on-surface">漢語拼音 (Pinyin)</span>
</label>
<label class="flex items-center gap-3 cursor-pointer">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="phonetic_pref" type="radio" value="mixed"/>
<span class="font-body-target-md text-on-surface">混合顯示 (Mixed)</span>
</label>
</div>
<p class="font-caption text-caption text-on-surface-variant bg-surface-container-low p-2 rounded-lg mt-2">
<span class="material-symbols-outlined text-[16px] align-middle mr-1" data-icon="info">info</span>
                此設定將套用至所有新產生的學習卡片。
            </p>
</section>
<!-- Section 4: 關於 -->
<section class="bg-surface-bright rounded-xl border border-outline-variant p-4 flex flex-col shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-primary border-b border-surface-variant pb-2 mb-2">關於</h2>
<button class="text-left font-body-target-md text-on-surface flex items-center justify-between w-full hover:bg-surface-variant/20 p-3 rounded-lg transition-colors">
<span>重新觀看教學導覽</span>
<span class="material-symbols-outlined text-outline">school</span>
</button>
<div class="h-[1px] bg-outline-variant/30 mx-3"></div>
<button class="text-left font-body-target-md text-on-surface flex items-center justify-between w-full hover:bg-surface-variant/20 p-3 rounded-lg transition-colors">
<span>隱私權政策與服務條款</span>
<span class="material-symbols-outlined text-outline">policy</span>
</button>
<div class="h-[1px] bg-outline-variant/30 mx-3"></div>
<div class="p-3 flex justify-between items-center text-on-surface-variant">
<span class="font-body-target-md">應用程式版本</span>
<span class="font-label-mono text-label-mono">v1.2.4 (Build 842)</span>
</div>
</section>
<!-- Logout -->
<div class="mt-4 mb-8">
<button class="w-full border-2 border-secondary text-secondary font-label-mono text-label-mono py-3 rounded-full hover:bg-secondary/10 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                登出帳號
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-bottom-bar-height px-4 pb-safe bg-surface-container shadow-[0_-2px_8px_0_rgba(0,0,0,0.1)] rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-mono text-label-mono mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="import_contacts">import_contacts</span>
<span class="font-label-mono text-label-mono mt-1">Notebook</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined filled" data-icon="settings">settings</span>
<span class="font-label-mono text-label-mono mt-1">Settings</span>
</a>
</nav>
<!-- Padding for mobile bottom nav -->
<div class="h-bottom-bar-height md:h-0 w-full"></div>
</body></html>
