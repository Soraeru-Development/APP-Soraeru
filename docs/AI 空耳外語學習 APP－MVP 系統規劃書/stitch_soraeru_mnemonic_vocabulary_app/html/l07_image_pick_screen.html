<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-target-md">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-md flex justify-between items-center px-gutter h-appbar-height max-w-[600px] mx-auto left-0 right-0">
<button aria-label="返回" class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface-variant/50 transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">圖片取字</h1>
<div class="w-10 h-10"></div> <!-- Placeholder to balance layout -->
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-[600px] mx-auto pt-appbar-height pb-bottom-bar-height flex flex-col px-gutter gap-stack-gap">
<!-- Image Preview Area (Glassmorphism inspired container) -->
<div class="mt-4 flex-1 min-h-[300px] w-full bg-surface-bright border border-outline-variant/30 rounded-xl overflow-hidden relative shadow-sm flex flex-col items-center justify-center group cursor-pointer transition-all hover:border-primary/50">
<!-- Default Empty State -->
<div class="absolute inset-0 image-placeholder-pattern opacity-50 z-0"></div>
<div class="z-10 flex flex-col items-center justify-center p-6 text-center">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-4 shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="add_photo_alternate" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_photo_alternate</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface mb-2">選擇或拍攝圖片</p>
<p class="font-body-target-md text-body-target-md text-on-surface-variant text-sm">請確保文字清晰可見，以獲得最佳辨識效果。</p>
</div>
<!-- Optional: Simulated active image overlay (hidden by default in this state) -->
<!-- <img src="placeholder" data-alt="A modern, high-contrast close up of a printed document featuring traditional chinese characters. The lighting is soft and even, typical of a well-lit office environment, ensuring the text is crisp against the white paper. The visual style is practical and realistic." class="absolute inset-0 w-full h-full object-cover z-20 hidden" alt="Selected Document"> -->
</div>
<!-- Action Buttons (Side-by-side Bento style) -->
<div class="grid grid-cols-2 gap-4 mt-2">
<button class="flex flex-col items-center justify-center gap-2 py-4 px-2 bg-surface-container-low border border-outline-variant/50 rounded-xl hover:bg-surface-container hover:border-outline transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="photo_camera">photo_camera</span>
<span class="font-label-mono text-label-mono text-on-surface">拍照</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 py-4 px-2 bg-surface-container-low border border-outline-variant/50 rounded-xl hover:bg-surface-container hover:border-outline transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="photo_library">photo_library</span>
<span class="font-label-mono text-label-mono text-on-surface">相簿</span>
</button>
</div>
<!-- Privacy Notice Panel (Safety-First Utility) -->
<div class="mt-4 bg-surface-container-lowest border-l-4 border-status-info rounded-r-lg p-4 shadow-sm flex items-start gap-3">
<span class="material-symbols-outlined text-status-info flex-shrink-0" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-caption text-caption text-on-surface-variant">圖片僅在手機端辨識，不會上傳至伺服器。保障您的資料隱私與安全。</p>
</div>
<!-- Spacer to push content up if needed -->
<div class="h-8"></div>
</main>
<!-- Sticky Bottom Bar (Critical Path Action) -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface-bright/90 backdrop-blur-lg shadow-[0_-4px_16px_0_rgba(0,0,0,0.05)] border-t border-outline-variant/20 px-gutter h-bottom-bar-height flex items-center justify-center pb-safe max-w-[600px] mx-auto right-0">
<!-- Primary CTA - Disabled state initially since no image is selected, but shown active for UI demonstration -->
<button aria-label="開始辨識" class="w-full max-w-[400px] h-14 bg-primary text-on-primary rounded-full font-headline-sm text-headline-sm font-bold flex items-center justify-center gap-2 shadow-md hover:opacity-90 transition-opacity disabled:bg-surface-variant disabled:text-on-surface-variant disabled:shadow-none" type="button">
<span>開始辨識</span>
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
</button>
