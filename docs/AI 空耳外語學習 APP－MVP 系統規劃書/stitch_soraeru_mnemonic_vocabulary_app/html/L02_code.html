<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar (Transactional Screen - Suppress Navigation, use Back action) -->
<header class="fixed top-0 w-full max-w-[600px] bg-surface/80 backdrop-blur-md z-40">
<div class="flex justify-between items-center px-gutter h-appbar-height w-full mx-auto">
<button class="p-2 text-primary hover:bg-surface-variant/50 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">建立帳號</h1>
<div class="w-10"></div> <!-- Placeholder to balance header -->
</div>
</header>
<main class="w-full max-w-[600px] flex-1 mt-appbar-height px-gutter pb-bottom-bar-height pt-8 flex flex-col gap-6">
<form class="flex flex-col gap-5">
<!-- Display Name (Optional) -->
<div class="flex flex-col gap-1.5">
<label class="font-body-target-md text-body-target-md text-on-surface font-medium" for="displayName">顯示名稱 (選填)</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-body-target-md text-body-target-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="displayName" placeholder="例如：小明" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-body-target-md text-body-target-md text-on-surface font-medium" for="email">電子郵件</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-body-target-md text-body-target-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="font-body-target-md text-body-target-md text-on-surface font-medium" for="password">密碼</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-body-target-md text-body-target-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="password" minlength="8" placeholder="至少 8 個字元" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<p class="font-caption text-caption text-on-surface-variant">請輸入至少 8 個字元的密碼。</p>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1.5">
<label class="font-body-target-md text-body-target-md text-on-surface font-medium" for="confirmPassword">確認密碼</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 font-body-target-md text-body-target-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="confirmPassword" minlength="8" placeholder="再次輸入密碼" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Privacy Policy Checkbox -->
<div class="flex items-center gap-3 mt-2 bg-surface-container-low p-4 rounded-lg border border-surface-variant">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-bright" id="privacyPolicy" required="" type="checkbox"/>
<label class="font-body-target-md text-body-target-md text-on-surface cursor-pointer select-none" for="privacyPolicy">
                    我已閱讀 <a class="text-primary underline hover:text-primary-container transition-colors" href="#">隱私權政策</a>
</label>
</div>
</form>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 w-full max-w-[600px] h-bottom-bar-height bg-surface/90 backdrop-blur-md border-t border-surface-variant px-gutter flex items-center justify-center z-40 pb-safe">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm py-3 rounded-full transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
            建立帳號
        </button>
</div>
