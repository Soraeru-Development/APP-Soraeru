<body class="min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-[600px] bg-surface/80 backdrop-blur-md h-appbar-height flex justify-between items-center px-gutter z-50">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-bold">重設密碼</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->

<main class="flex-1 w-full max-w-[600px] pt-[80px] pb-bottom-bar-height px-gutter flex flex-col bg-surface-bright">
<div class="mt-8 mb-10 flex flex-col gap-4">
<p class="font-body-target-md text-body-target-md text-on-surface-variant">
                請輸入您註冊時使用的電子郵件地址。我們將發送一封包含重設密碼連結的郵件給您。
            </p>
</div>
<form class="flex flex-col gap-stack-gap">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant" for="email">電子郵件 Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-target-md text-body-target-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="mt-8 flex justify-center">
<button class="w-full max-w-sm h-12 bg-primary text-on-primary rounded-full font-label-mono text-label-mono hover:bg-on-primary-fixed transition-colors shadow-sm flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">send</span>

                </button>
</div>
<div class="mt-6 flex justify-center">
<a class="font-label-mono text-label-mono text-primary hover:text-primary-container transition-colors flex items-center gap-1" href="#">

                </a>
</div>
</form>
