    function scoreTone(score) {
      if (score >= 4) return "success";
      if (score >= 3) return "warning";
      return "danger";
    }

    function mark(score) {
      if (score === null) return "-";
      if (score >= 4) return "OK";
      if (score >= 3) return "~";
      return "X";
    }

      success: {

        border: "border-emerald-800/60",
        text: "text-emerald-400",

        badgeText: "text-emerald-300",
        barBg: "bg-emerald-500"
      },
      warning: {
        bg: "bg-amber-950/40",
        border: "border-amber-800/60",
        text: "text-amber-400",
        badgeBg: "bg-amber-500/20",
        badgeText: "text-amber-300",
        barBg: "bg-amber-500"
      },
      danger: {
        bg: "bg-rose-950/40",
        border: "border-rose-800/60",
        text: "text-rose-400",
        badgeBg: "bg-rose-500/20",
        badgeText: "text-rose-300",
        barBg: "bg-rose-500"
      },
      info: {
        bg: "bg-sky-950/40",
        border: "border-sky-800/60",
        text: "text-sky-400",
        badgeBg: "bg-sky-500/20",
        badgeText: "text-sky-300",
        barBg: "bg-sky-500"

      neutral: {
        bg: "bg-slate-900/60",
        border: "border-slate-800",
        text: "text-slate-300",
        badgeBg: "bg-slate-800",
        badgeText: "text-slate-300",
        barBg: "bg-slate-600"
      }
    };

    const Stack = ({ gap = 16, children, style = {} }) => (
      <div className="flex flex-col" style={{ gap: `${gap}px`, ...style }}>
        {children}
      </div>
    );

    const Row = ({ gap = 8, wrap = false, children, style = {} }) => (
      <div 
        className={`flex flex-row items-center ${wrap ? 'flex-wrap' : ''}`} 
        style={{ gap: `${gap}px`, ...style }}
      >
        {children}
      </div>
    );

    const Grid = ({ columns = 2, gap = 12, children, style = {} }) => {
      let gridCols = 'grid-cols-1 md:grid-cols-2';
      if (columns === 4) gridCols = 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-4';
      if (columns === 3) gridCols = 'grid-cols-1 md:grid-cols-3';
      
      const customStyle = typeof columns === 'string' 
        ? { gridTemplateColumns: columns, ...style } 
        : style;

      return (
        <div className={`grid ${typeof columns === 'number' ? gridCols : ''}`} style={{ gap: `${gap}px`, ...customStyle }}>
          {children}
        </div>
      );
    };

    const H1 = ({ children }) => (
      <h1 className="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
        {children}
      </h1>
    );

    const H2 = ({ children }) => (
      <h2 className="text-xl font-semibold tracking-tight text-slate-100 mt-2 flex items-center gap-2">
        {children}
      </h2>
    );

    const H3 = ({ children }) => (
      <h3 className="text-base font-medium text-slate-200 mt-1">
        {children}
      </h3>
    );

    const Text = ({ tone = "primary", size = "normal", weight = "normal", as = "p", children }) => {
      const Component = as;
      const colorMap = {
        primary: "text-slate-200",
        secondary: "text-slate-400",
        tertiary: "text-slate-500",
      };
      const sizeMap = {
        small: "text-xs",
        normal: "text-sm",
        large: "text-base",
      };
      const weightMap = {
        normal: "font-normal",
        medium: "font-medium",
        semibold: "font-semibold",
        bold: "font-bold",
      };

      return (
        <Component className={`${colorMap[tone] || colorMap.primary} ${sizeMap[size]} ${weightMap[weight]}`}>
          {children}
        </Component>
      );
    };

    const Callout = ({ tone = "info", title, children }) => {
      const styles = toneStyles[tone] || toneStyles.info;
      return (
        <div className={`p-4 rounded-xl border ${styles.bg} ${styles.border} transition-all`}>
          {title && <h4 className={`font-semibold text-sm mb-1 ${styles.text}`}>{title}</h4>}
          <div className="text-xs md:text-sm text-slate-300 leading-relaxed">
            {children}
          </div>
        </div>
      );
    };

    const Pill = ({ active = false, size = "sm", tone = "neutral", children }) => {
      const styles = toneStyles[tone] || toneStyles.neutral;
      return (
        <span className={`inline-flex items-center font-medium rounded-full px-2.5 py-0.5 text-xs transition-colors ${

            ? `${styles.badgeBg} ${styles.badgeText} border border-${tone}-500/30`

        }`}>
          {children}
        </span>
      );
    };

    const Stat = ({ value, label, tone = "neutral" }) => {
      const styles = toneStyles[tone] || toneStyles.neutral;
      return (
        <div className={`p-4 rounded-xl border bg-slate-900/60 border-slate-800 relative overflow-hidden group hover:border-slate-700 transition-all`}>

            {value}
          </div>
          <div className="text-xs text-slate-400 font-medium pl-2">
            {label}

    const BarChart = ({ categories, series, yMin = 0, yMax = 5, height = 220, showValues = false, referenceLines = [] }) => {
      return (
        <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-4 my-2">
          <div className="relative w-full" style={{ height: `${height}px` }}>
            {/* Reference lines */}
            {referenceLines.map((ref, idx) => {
              const bottomPercent = ((ref.value - yMin) / (yMax - yMin)) * 100;
              const refTone = toneStyles[ref.tone] || toneStyles.info;
              return (
                <div 
                  key={idx} 
                  className="absolute w-full border-t border-dashed pointer-events-none flex items-center justify-end pr-2 text-[10px] z-10"
                  style={{ 
                    bottom: `${bottomPercent}%`, 
                    borderColor: ref.tone === 'success' ? '#10b981' : ref.tone === 'warning' ? '#f59e0b' : '#3b82f6'
                  }}
                >
                  <span className={`px-1.5 py-0.5 rounded ${refTone.badgeBg} ${refTone.badgeText} font-semibold`}>
                    {ref.label} ({ref.value})
                  </span>
                </div>
              );
            })}

            {/* Bars container */}
            <div className="flex h-full items-end justify-between gap-2 pt-6 pb-2">
              {categories.map((cat, idx) => {
                const val = series[0]?.data[idx] ?? 0;
                const heightPercent = Math.max(0, Math.min(100, ((val - yMin) / (yMax - yMin)) * 100));
                const toneKey = scoreTone(val);
                const currentTone = toneStyles[toneKey] || toneStyles.info;

                return (
                  <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group">
                    {showValues && (
                      <span className="text-xs font-bold text-slate-300 mb-1 opacity-80 group-hover:opacity-100 transition-opacity">
                        {val}
                      </span>
                    )}
                    <div className="w-full max-w-[40px] bg-slate-800/50 rounded-t overflow-hidden flex items-end h-full">
                      <div 
                        className={`w-full rounded-t transition-all duration-500 ${currentTone.barBg} group-hover:brightness-125`}
                        style={{ height: `${heightPercent}%` }}
                      ></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* X Axis Labels */}
          <div className="flex justify-between gap-2 border-t border-slate-800 pt-2 text-center">
            {categories.map((cat, idx) => (
              <div key={idx} className="flex-1 text-[11px] font-medium text-slate-400 truncate" title={cat}>
                {cat}
              </div>
            ))}
          </div>
        </div>
      );
    };

      return Math.round(((a + b) / 2) * 10) / 10;
    }
